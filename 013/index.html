<style>
  :root {
    --bg: #060709;
    --bg-raise: #0b0d10;
    --ink: #edeff1;
    --muted: #7d848c;
    --faint: #4a5057;
    --line: rgba(237, 239, 241, 0.1);
    --line-strong: rgba(237, 239, 241, 0.28);
    --live: #4ade80;

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

    background-image: radial-gradient(rgba(237, 239, 241, 0.045) 1px, transparent 1px);
    background-size: 36px 36px;

  ::selection { background: var(--accent); color: var(--bg); }
  a { color: inherit; text-decoration: none; }
  button:focus-visible, a:focus-visible {
    outline: 1px solid var(--ink); outline-offset: 3px;
  }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); }

  .nav {
    position: sticky; top: 0; z-index: 50;

  .nav-lang {

  }

  main { max-width: 880px; margin: 0 auto; padding: clamp(40px, 7vh, 72px) var(--pad) 96px; }

  .hero { margin-bottom: clamp(28px, 5vh, 44px); }
  .hero .eyebrow { color: var(--accent); margin-bottom: 18px; }
  .hero h1 {
    font-size: clamp(2rem, 5.5vw, 3.4rem); font-weight: 700; line-height: 1.14;

  .filters {
    display: flex; flex-wrap: wrap; gap: 8px;

  .chip {

  .m-no {

  .m-url { font-family: var(--mono); font-size: 12px; letter-spacing: 0.05em; color: var(--muted); overflow-wrap: anywhere; }

  .is-live { color: var(--live); }
  .is-dev .dot { border: 1px solid var(--muted); animation: pulse 2.4s ease-in-out infinite; }
  .is-dev { color: var(--muted); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .m-arrow { color: var(--faint); font-size: 18px; transition: transform 0.2s, color 0.2s; text-align: right; }
  .empty {
    padding: 36px 8px; color: var(--muted); border-bottom: 1px solid var(--line);
  }
  @media (max-width: 760px) {
    .m-row { grid-template-columns: 44px 1fr auto; }
    .m-url, .m-arrow { display: none; }
    .m-cat { grid-column: 2 / 4; grid-row: 2; }

  .share-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
  .share-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;

  .share-canvas-wrap { display: none; margin-top: 16px; }

  .share-save-hint { color: var(--faint); font-size: 0.8rem; margin-top: 8px; font-family: var(--mono); letter-spacing: 0.04em; }

  footer {
    border-top: 1px solid var(--line); padding: 24px var(--pad);
    display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between;
  }
  footer .mono { letter-spacing: 0.16em; }
  footer a { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
    .is-dev .dot { animation: none; }
  }
</style>

<script type="module">
  import { FILTERS, catLabels, counts, filterSites, markLive, normalizeCat, rowHref } from "./engine.js";

  let lang = "zh";
  try { lang = localStorage.getItem("lang") || "zh"; } catch (e) {}
  let catalog = JSON.parse(document.getElementById("catalogFallback").textContent);
  let cat = normalizeCat((location.hash || "").replace(/^#/, "") || "all");

  const $ = (id) => document.getElementById(id);
  function t(zh, en) { return lang === "en" ? en : zh; }

  function applyLang(l) {
    lang = l;
    document.querySelectorAll("[data-en]").forEach((el) => {
      if (el.dataset.zh === undefined) el.dataset.zh = el.innerHTML;
      el.innerHTML = l === "en" ? el.dataset.en : el.dataset.zh;
    });
    document.documentElement.lang = l === "en" ? "en" : "zh-CN";
    $("langBtn").textContent = l === "en" ? "中文" : "EN";
    try { localStorage.setItem("lang", l); } catch (e) {}
    renderFilters();
    renderList();
  }
  $("langBtn").addEventListener("click", () => applyLang(lang === "en" ? "zh" : "en"));

  function rowHash(id, name) {
    const src = id + (name || "");
    let seed = 7;
    for (const ch of src) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
    seed = Math.imul(seed ^ (seed >>> 13), 0x5bd1e995) >>> 0;
    seed = (seed ^ (seed >>> 15)) >>> 0;
    return "0x" + ("00000" + (seed % 0xffffff).toString(16)).slice(-6).toUpperCase();
  }

  function renderFilters() {
    const box = $("filters");
    box.innerHTML = FILTERS.map((f) => {
      const label = lang === "en" ? f.en : f.zh;
      const on = f.id === cat;
      return `<button type="button" class="chip" role="tab" data-cat="${f.id}" aria-pressed="${on}">${label}</button>`;
    }).join("");
  }

  function renderList() {
    const sites = filterSites(catalog.sites, cat);
    const all = counts(catalog.sites);
    const shown = counts(sites);
    const fname = FILTERS.find((f) => f.id === cat);
    const fnameLabel = fname ? (lang === "en" ? fname.en : fname.zh) : cat;
    $("metaLine").textContent = t(
      `${shown.total} 个 · Live ${String(shown.live).padStart(3, "0")} · In Dev ${String(shown.dev).padStart(3, "0")} · ${fnameLabel}（全表 ${all.total}）`,
      `${shown.total} · Live ${String(shown.live).padStart(3, "0")} · In Dev ${String(shown.dev).padStart(3, "0")} · ${fnameLabel} (of ${all.total})`
    );

    const root = $("manifest");
    if (!sites.length) {
      root.innerHTML = `<p class="empty">${t("这一类还没有项目。", "Nothing in this category yet.")}</p>`;
      return;
    }

    root.innerHTML = sites.map((s) => {
      const href = rowHref(s);
      const sub = lang === "en" ? (s.sub_en || s.sub_zh) : (s.sub_zh || s.sub_en);
      const cats = catLabels(s.cats, lang).join(" · ") || "—";
      const status = s.live
        ? `<span class="m-status is-live"><i class="dot"></i>Live</span>`
        : `<span class="m-status is-dev"><i class="dot"></i>In&nbsp;Dev</span>`;
      const urlText = s.live ? ("build-100.com/" + s.id) : t("尚未挂上", "Not shipped");
      const here = s.id === "013" ? " is-here" : "";
      const inner = `
        <span class="m-no">${s.id}<i class="m-hash">${rowHash(s.id, s.name)}</i></span>
        <span class="m-name">${esc(s.name)}<span>${esc(sub)}</span></span>
        <span class="m-cat">${esc(cats)}<span class="mono" style="margin-left:10px">${esc(urlText)}</span></span>
        ${status}
        <span class="m-arrow">${href ? "↗" : ""}</span>`;
      if (href) {
        return `<a class="m-row${here}" href="${esc(href)}">${inner}</a>`;
      }
      return `<div class="m-row${here}" aria-disabled="true">${inner}</div>`;
    }).join("");
  }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  }

  function setCat(next) {
    cat = normalizeCat(next);
    const url = new URL(location.href);
    url.hash = cat === "all" ? "" : cat;
    history.replaceState(null, "", url);
    renderFilters();
    renderList();
  }

  $("filters").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-cat]");
    if (!btn) return;
    setCat(btn.dataset.cat);
  });
  window.addEventListener("hashchange", () => setCat((location.hash || "").replace(/^#/, "") || "all"));

  $("copyBtn").addEventListener("click", () => {
    const url = location.href;
    const btn = $("copyBtn");
    const done = () => {
      btn.classList.add("copied");
      const origZh = btn.dataset.zh || "复制当前筛选";
      const origEn = btn.dataset.en || "Copy this filter";
      btn.textContent = t("已复制 ✓", "Copied ✓");
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.textContent = lang === "en" ? origEn : origZh;
      }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, () => fallbackCopy(url, done));
    } else fallbackCopy(url, done);
  });
  function fallbackCopy(text, cb) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    ta.remove();
    cb();
  }

  $("cardBtn").addEventListener("click", () => {
    const canvas = $("shareCanvas");
    const ctx = canvas.getContext("2d");
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = "#060709";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(237,239,241,0.06)";
    for (let x = 0; x < W; x += 36) for (let y = 0; y < H; y += 36) ctx.fillRect(x, y, 1, 1);
    ctx.fillStyle = "#67e8f9";
    ctx.font = "22px ui-monospace, SF Mono, Menlo, monospace";
    ctx.fillText("INDEX-013", 64, 72);
    ctx.fillStyle = "#edeff1";
    ctx.font = "700 44px Helvetica Neue, PingFang SC, sans-serif";
    ctx.fillText(t("001–013 分类总目录", "001–013 catalog"), 64, 140);
    const sites = filterSites(catalog.sites, cat);
    ctx.font = "22px ui-monospace, SF Mono, Menlo, monospace";
    sites.slice(0, 8).forEach((s, i) => {
      ctx.fillStyle = s.live ? "#4ade80" : "#7d848c";
      const mark = s.live ? "LIVE" : "DEV ";
      ctx.fillText(s.id + "  " + mark + "  " + s.code, 64, 210 + i * 40);
    });
    ctx.fillStyle = "#7d848c";
    ctx.font = "20px ui-monospace, SF Mono, Menlo, monospace";
    ctx.fillText("build-100.com/013", 64, H - 56);
    $("shareCanvasWrap").classList.add("show");
  });

  async function probeLive() {
    const jobs = catalog.sites.map(async (s, i) => {
      if (s.live) return;
      try {
        const r = await fetch("/" + s.id + "/", { method: "GET", cache: "no-store" });
        if (!r.ok) return;
        const text = await r.text();
        // Directory listings and empty folders are 200 on some servers — only promote a real page.
        if (/<html[\s>]/i.test(text) && /nav-brand|BUILD-100/i.test(text)) {
          catalog.sites[i] = markLive(s, true);
        }
      } catch (e) {}
    });
    await Promise.all(jobs);
    renderList();
  }

  async function boot() {
    try {
