<script type="module">
  import {
    daysUntil, dueStatus, monthlyEquivalent, totalMonthly, soonestDue,
    normalizeSub, compareRents, packProgress, mergePack,
    seedSubs, seedApts,
  } from "./engine.js?v=1";

  const KEYS = { subs: "life006.subs", apts: "life006.apts", pack: "life006.pack" };
  const CYCLE_ZH = { weekly: "每周", monthly: "每月", quarterly: "每季", yearly: "每年" };
  const CYCLE_EN = { weekly: "weekly", monthly: "monthly", quarterly: "quarterly", yearly: "yearly" };

  let lang = "zh";
  try { lang = localStorage.getItem("lang") || "zh"; } catch (e) {}
  if (lang !== "en") lang = "zh";

  function L(zh, en) { return lang === "en" ? en : zh; }
  function esc(s) {
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback();
      return JSON.parse(raw);
    } catch (e) { return fallback(); }
  }
  function save(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  const rawSubs = load(KEYS.subs, () => null);
  let subs = Array.isArray(rawSubs) ? rawSubs.map(normalizeSub).filter(Boolean) : seedSubs();

  const rawApts = load(KEYS.apts, () => null);
  let apts = Array.isArray(rawApts) && rawApts.length >= 2 ? rawApts.slice(0, 4) : seedApts();

  let packState = load(KEYS.pack, () => ({ travel: { checked: {}, custom: [] }, move: { checked: {}, custom: [] } }));
  if (!packState.travel) packState.travel = { checked: {}, custom: [] };
  if (!packState.move) packState.move = { checked: {}, custom: [] };
  let packKind = "travel";

  function persist() {
    save(KEYS.subs, subs);
    save(KEYS.apts, apts);
    save(KEYS.pack, packState);
  }

  function applyLang(l) {
    lang = l === "en" ? "en" : "zh";
    document.querySelectorAll("[data-en]").forEach((el) => {
      if (el.tagName === "OPTION") {
        const zh = el.dataset.zh || el.textContent;
        if (!el.dataset.zh) el.dataset.zh = zh;
        el.textContent = lang === "en" ? el.dataset.en : zh;
        return;
      }
      if (el.dataset.zh === undefined) el.dataset.zh = el.innerHTML;
      el.innerHTML = lang === "en" ? el.dataset.en : el.dataset.zh;
    });
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    document.title = lang === "en" ? "LIFE-006 · Life admin toolbox" : "LIFE-006 · 生活麻烦工具箱";
    document.getElementById("langBtn").textContent = lang === "en" ? "中文" : "EN";
    const ph = document.getElementById("packCustom");
    ph.placeholder = lang === "en" ? ph.dataset.phEn : ph.dataset.phZh;
    try { localStorage.setItem("lang", lang); } catch (e) {}
    renderAll();
  }

  document.getElementById("langBtn").addEventListener("click", () => applyLang(lang === "en" ? "zh" : "en"));

  const panels = {
    subs: document.getElementById("panel-subs"),
    rent: document.getElementById("panel-rent"),
    pack: document.getElementById("panel-pack"),
  };
  function setTab(id) {
    const key = panels[id] ? id : "subs";
    document.querySelectorAll(".tabs > .tab[data-tab]").forEach((t) => {
      const on = t.dataset.tab === key;
      t.classList.toggle("active", on);
      t.setAttribute("aria-selected", on ? "true" : "false");
    });
    Object.entries(panels).forEach(([k, el]) => el.classList.toggle("show", k === key));
    if (location.hash !== "#" + key) history.replaceState(null, "", "#" + key);
  }
  document.querySelectorAll(".tab[data-tab]").forEach((t) => {
    t.addEventListener("click", () => setTab(t.dataset.tab));
  });
  window.addEventListener("hashchange", () => setTab(location.hash.replace("#", "")));
  setTab((location.hash || "#subs").replace("#", ""));

  function money(n) {
    const x = Number(n);
    if (!Number.isFinite(x)) return "—";
    return (x % 1 ? x.toFixed(2) : String(x));
  }

  function renderSubs() {
    const banner = document.getElementById("subBanner");
    const monthly = totalMonthly(subs);
    const next = soonestDue(subs);
    let nextLine = L("还没有订阅", "No subscriptions yet");
    if (next) {
      const d = next.days;
      const name = next.sub.name || L("未命名", "Untitled");
      if (d < 0) nextLine = L(`${name} 已过期 ${-d} 天`, `${name} overdue by ${-d}d`);
      else if (d === 0) nextLine = L(`${name} 今天扣款`, `${name} charges today`);
      else nextLine = L(`${name} 还有 ${d} 天`, `${name} in ${d} days`);
    }
    banner.innerHTML =
      `<div><div class="lbl" data-skip>${L("折合每月", "Effective / month")}</div><div class="big">${money(monthly)}</div></div>` +
      `<div class="lbl">${esc(nextLine)} · ${L("≤7 天高亮", "highlighted if ≤7 days")}</div>`;

    const ul = document.getElementById("subList");
    if (!subs.length) {
      ul.innerHTML = `<li class="empty">${L("加上第一笔订阅。扣款日前 7 天会亮起来。", "Add a subscription. It lights up 7 days before the charge.")}</li>`;
      return;
    }
    const sorted = subs.slice().sort((a, b) => {
      const da = daysUntil(a.next); const db = daysUntil(b.next);
      if (da === null) return 1; if (db === null) return -1;
      return da - db;
    });
    ul.innerHTML = sorted.map((s) => {
      const st = dueStatus(s.next);
      const d = daysUntil(s.next);
      let when = L("未填日期", "No date");
      if (d === 0) when = L("今天", "today");
      else if (d !== null && d < 0) when = L(`过期 ${-d} 天`, `${-d}d overdue`);
      else if (d !== null) when = L(`${d} 天后 · ${s.next}`, `in ${d}d · ${s.next}`);
      const pill = st === "overdue" ? L("已过期", "Overdue") : st === "soon" ? L("将近", "Due soon") : L("正常", "OK");
      const cyc = lang === "en" ? CYCLE_EN[s.cycle] : CYCLE_ZH[s.cycle];
      return `<li class="sub-card ${st}">
        <div>
          <div class="sub-name">${esc(s.name || L("未命名", "Untitled"))}</div>
          <div class="sub-meta">${money(s.fee)} · ${esc(cyc)} · ${L("折合每月", "≈/mo")} ${money(monthlyEquivalent(s.fee, s.cycle))} · ${esc(when)}</div>
        </div>
        <span class="pill ${st}">${pill}</span>
        <button class="del" type="button" data-del="${esc(s.id)}">${L("删除", "Delete")}</button>
      </li>`;
    }).join("");
  }

  document.getElementById("subList").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-del]");
    if (!btn) return;
    subs = subs.filter((s) => s.id !== btn.dataset.del);
    persist(); renderSubs();
  });

  document.getElementById("subForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("subName").value.trim();
    const fee = Number(document.getElementById("subFee").value);
    const cycle = document.getElementById("subCycle").value;
    const next = document.getElementById("subNext").value;
    const row = normalizeSub({ id: uid(), name, fee, cycle, next });
    if (!row || !row.name || !row.next) return;
    subs.push(row);
    persist();
    e.target.reset();
    renderSubs();
  });

  function renderApts() {
    const grid = document.getElementById("aptGrid");
    grid.innerHTML = apts.map((a, i) => `
      <article class="apt-card" data-apt="${esc(a.id)}">
        <h3>
          <input value="${esc(a.name || "")}" data-k="name" maxlength="40" aria-label="name">
          ${apts.length > 2 ? `<button class="del" type="button" data-rm="${esc(a.id)}">${L("去掉", "Remove")}</button>` : ""}
        </h3>
        <div class="apt-fields">
          <label class="fld"><span>${L("月租", "Rent / mo")}</span><input type="number" min="0" step="1" data-k="rent" value="${esc(a.rent ?? "")}"></label>
          <label class="fld"><span>${L("押金", "Deposit")}</span><input type="number" min="0" step="1" data-k="deposit" value="${esc(a.deposit ?? "")}"></label>
          <label class="fld"><span>${L("通勤（分钟）", "Commute min")}</span><input type="number" min="0" step="1" data-k="commute" value="${esc(a.commute ?? "")}"></label>
          <label class="fld"><span>${L("面积 ㎡", "Area m²")}</span><input type="number" min="0" step="0.1" data-k="area" value="${esc(a.area ?? "")}"></label>
        </div>
        <label class="fld"><span>${L("备注", "Note")}</span><input data-k="note" maxlength="80" value="${esc(a.note || "")}"></label>
      </article>`).join("");

    document.getElementById("addApt").disabled = apts.length >= 4;
    document.getElementById("rmApt").disabled = apts.length <= 2;
    renderTable();
  }

  function renderTable() {
    const cmp = compareRents(apts);
    const labels = [
      ["rent", L("月租", "Rent / mo")],
      ["deposit", L("押金", "Deposit")],
      ["commute", L("通勤（分）", "Commute (min)")],
      ["area", L("面积 ㎡", "Area m²")],
      ["perSqm", L("月租 / ㎡", "Rent / m²")],
      ["moveIn", L("入住首付（租+押）", "Move-in (rent+deposit)")],
    ];
    const fmt = (key, v) => {
      if (v === null || v === undefined || !Number.isFinite(Number(v))) return "—";
      if (key === "perSqm") return Number(v).toFixed(1);
      if (key === "commute") return String(v);
      return money(v);
    };
    let html = "<thead><tr><th></th>" + apts.map((a) => `<th>${esc(a.name || "—")}</th>`).join("") + "</tr></thead><tbody>";
    for (const [key, lab] of labels) {
      html += `<tr><td>${lab}</td>`;
      cmp.rows.forEach((r) => {
        const v = r.metrics[key];
        html += `<td class="${r.win[key] ? "win" : ""}">${fmt(key, v)}</td>`;
      });
      html += "</tr>";
    }
    html += `<tr><td>${L("备注", "Note")}</td>` + apts.map((a) => `<td class="note-cell">${esc(a.note || "—")}</td>`).join("") + "</tr>";
    html += "</tbody>";
    document.getElementById("cmpTable").innerHTML = html;
  }

  document.getElementById("aptGrid").addEventListener("input", (e) => {
    const card = e.target.closest("[data-apt]");
    if (!card) return;
    const apt = apts.find((a) => a.id === card.dataset.apt);
    if (!apt) return;
    const k = e.target.dataset.k;
    if (!k) return;
    if (k === "name" || k === "note") apt[k] = e.target.value;
    else apt[k] = e.target.value === "" ? "" : Number(e.target.value);
    persist();
    renderTable();
  });
  document.getElementById("aptGrid").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-rm]");
    if (!btn) return;
    if (apts.length <= 2) return;
    apts = apts.filter((a) => a.id !== btn.dataset.rm);
    persist(); renderApts();
  });
  document.getElementById("addApt").addEventListener("click", () => {
    if (apts.length >= 4) return;
    const n = apts.length + 1;
    const names = ["A", "B", "C", "D"];
    apts.push({ id: uid(), name: names[n - 1] || String(n), rent: "", deposit: "", commute: "", area: "", note: "" });
    persist(); renderApts();
  });
  document.getElementById("rmApt").addEventListener("click", () => {
    if (apts.length <= 2) return;
    apts.pop();
    persist(); renderApts();
  });

  function renderPack() {
    document.getElementById("packTravel").classList.toggle("active", packKind === "travel");
    document.getElementById("packMove").classList.toggle("active", packKind === "move");
    const items = mergePack(packKind, packState[packKind]);
    const st = packProgress(items);
    document.getElementById("packStat").textContent = L(
      `${st.done} / ${st.total} · ${st.pct}%`,
      `${st.done} / ${st.total} · ${st.pct}%`
    );
    document.getElementById("packBar").style.width = st.pct + "%";
    document.getElementById("packList").innerHTML = items.map((it) => `
      <li class="${it.checked ? "done" : ""}">
        <input type="checkbox" ${it.checked ? "checked" : ""} data-id="${esc(it.id)}">
        <label>${esc(lang === "en" ? it.en : it.zh)}</label>
        ${it.custom ? `<button class="del" type="button" data-x="${esc(it.id)}">${L("删", "Del")}</button>` : ""}
      </li>`).join("");
  }

  document.getElementById("packTravel").addEventListener("click", () => { packKind = "travel"; renderPack(); });
  document.getElementById("packMove").addEventListener("click", () => { packKind = "move"; renderPack(); });
  document.getElementById("packList").addEventListener("change", (e) => {
    const id = e.target.dataset.id;
    if (!id) return;
    const bucket = packState[packKind];
    if (!bucket.checked) bucket.checked = {};
    bucket.checked[id] = e.target.checked;
    persist(); renderPack();
  });
  document.getElementById("packList").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-x]");
    if (!btn) return;
    const bucket = packState[packKind];
    bucket.custom = (bucket.custom || []).filter((c) => c.id !== btn.dataset.x);
    if (bucket.checked) delete bucket.checked[btn.dataset.x];
    persist(); renderPack();
  });
  document.getElementById("packAdd").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = document.getElementById("packCustom").value.trim();
    if (!v) return;
    const bucket = packState[packKind];
    if (!bucket.custom) bucket.custom = [];
    bucket.custom.push({ id: "c-" + uid(), zh: v, en: v });
    document.getElementById("packCustom").value = "";
    persist(); renderPack();
  });

  function renderAll() { renderSubs(); renderApts(); renderPack(); }

  function summaryText() {
    const monthly = totalMonthly(subs);
    const next = soonestDue(subs);
    const packT = packProgress(mergePack("travel", packState.travel));
    const packM = packProgress(mergePack("move", packState.move));
    const lines = [
      "LIFE-006 · " + L("生活麻烦工具箱", "Life admin toolbox"),
      L(`订阅折合每月 ${money(monthly)}`, `Subs ≈ ${money(monthly)} / mo`),
      next ? L(`最近扣款：${next.sub.name}（${next.days} 天）`, `Next charge: ${next.sub.name} (${next.days}d)`) : "",
      L(`出行打包 ${packT.done}/${packT.total}`, `Travel pack ${packT.done}/${packT.total}`),
      L(`搬家打包 ${packM.done}/${packM.total}`, `Move pack ${packM.done}/${packM.total}`),
      "https://build-100.com/006/",
    ];
    return lines.filter(Boolean).join("\n");
  }

  document.getElementById("copyBtn").addEventListener("click", async () => {
    const text = summaryText();
    try { await navigator.clipboard.writeText(text); } catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (_) {} ta.remove();
    }
    const btn = document.getElementById("copyBtn");
    btn.classList.add("copied");
    const orig = btn.textContent;
    btn.textContent = L("已复制 ✓", "Copied ✓");
    setTimeout(() => { btn.classList.remove("copied"); btn.textContent = orig; }, 1600);
  });

  document.getElementById("shareImgBtn").addEventListener("click", () => {
    const c = document.getElementById("shareCanvas");
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#060709"; ctx.fillRect(0, 0, 800, 450);
    ctx.fillStyle = "#fb923c"; ctx.font = "14px ui-monospace, monospace";
    ctx.fillText("LIFE-006  ·  BUILD-100", 48, 64);
    ctx.fillStyle = "#edeff1"; ctx.font = "700 36px Helvetica, Arial, sans-serif";
    ctx.fillText(L("生活麻烦，收成一页。", "Life admin, one page."), 48, 130);
    ctx.fillStyle = "#fb923c"; ctx.font = "500 64px ui-monospace, monospace";
    ctx.fillText(money(totalMonthly(subs)), 48, 230);
    ctx.fillStyle = "#7d848c"; ctx.font = "16px Helvetica, Arial, sans-serif";
    ctx.fillText(L("折合每月订阅", "effective monthly subscriptions"), 48, 262);
    const next = soonestDue(subs);
    ctx.fillText(next ? (next.sub.name + "  ·  " + next.days + L(" 天", "d")) : "—", 48, 320);
    ctx.fillStyle = "#4a5057"; ctx.font = "13px ui-monospace, monospace";
    ctx.fillText("build-100.com/006", 48, 400);
    document.getElementById("shareCanvasWrap").classList.add("show");
  });

  applyLang(lang);
</script>
<script src="/beacon.js"></script>
</body>
</html>
